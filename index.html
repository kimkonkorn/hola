<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Flashcards</title>
  <style>
    :root {
      --bg-color: #faf8f5;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #777777;
      --accent-color: #e8e2d5;
      --accent-hover: #dcd4c3;
      --success-color: #a8c3a8;
      --skip-color: #e5b9a8;
      --shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    /* Header & Menu Nav */
    header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .menu-btn { font-size: 24px; background: none; border: none; cursor: pointer; color: var(--text-main); }
    .round-info { font-weight: bold; color: var(--text-sub); }

    /* Sidebar Drawer */
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card-bg); box-shadow: 2px 0 10px rgba(0,0,0,0.1); transition: 0.3s; z-index: 100; padding: 20px; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar h3 { margin-bottom: 15px; color: var(--text-main); }
    .round-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .round-item { padding: 8px; background: var(--bg-color); border: 1px solid var(--accent-color); border-radius: 6px; text-align: center; cursor: pointer; font-size: 14px; }
    .round-item:hover { background: var(--accent-color); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); display: none; z-index: 99; }
    .overlay.active { display: block; }

    /* Main Flashcard Setup */
    .container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; justify-content: center; }
    .card-container { width: 100%; height: 320px; perspective: 1000px; cursor: pointer; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 16px; box-shadow: var(--shadow); }
    .card.flipped { transform: rotateY(180deg); }

    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .card-back { transform: rotateY(180deg); }

    /* Card Front Style */
    .vocab-es { font-size: 36px; font-weight: bold; margin-bottom: 8px; color: #222; }
    .vocab-pos { font-size: 14px; font-style: italic; color: var(--text-sub); margin-bottom: 20px; }

    /* Card Back Style (Centered Content) */
    .translation { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); }
    .example-es { font-size: 16px; margin-bottom: 6px; }
    .example-th { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }

    /* Buttons Style */
    .audio-btn { background: var(--bg-color); border: 1px solid var(--accent-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .audio-btn:hover { background: var(--accent-color); }
    
    .action-btns { display: flex; gap: 15px; width: 100%; margin-top: 25px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-remember { background-color: var(--success-color); color: white; }
    .btn-skip { background-color: var(--skip-color); color: white; }
    .btn:active { transform: scale(0.98); }
    
    .counter { margin-top: 15px; font-size: 13px; color: var(--text-sub); }
  </style>
</head>
<body>

  <!-- Drawer & Navigation -->
  <header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="round-info" id="round-display">รอบที่ 1</div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="sidebar" id="sidebar">
    <h3>เลือกรอบการเรียนรู้</h3>
    <div class="round-list" id="round-list"></div>
  </div>

  <!-- Flashcard Area -->
  <div class="container">
    <div class="card-container" onclick="flipCard(event)">
      <div class="card" id="card">
        
        <!-- Front Side -->
        <div class="card-face card-front">
          <div class="vocab-es" id="front-es">-</div>
          <div class="vocab-pos" id="front-pos">-</div>
          <button class="audio-btn" onclick="speakCurrent(event, 'word')">🔊 ฟังเสียง</button>
        </div>

        <!-- Back Side -->
        <div class="card-face card-back">
          <div class="translation" id="back-th">-</div>
          <div class="example-es" id="back-ex-es">-</div>
          <div class="example-th" id="back-ex-th">-</div>
          <button class="audio-btn" onclick="speakCurrent(event, 'sentence')">🔊 ฟังประโยค</button>
        </div>

      </div>
    </div>

    <div class="action-btns">
      <button class="btn btn-skip" onclick="handleSkip()">ผ่าน (ฝึกซ้ำ)</button>
      <button class="btn btn-remember" onclick="handleRemember()">จำได้</button>
    </div>
    
    <div class="counter" id="card-counter">เหลือคำศัพท์ในรอบนี้: 0 คำ</div>
  </div>

    // State Variables
    let currentRound = 1;
    let currentQueue = [];
    let currentIndex = 0;

    // Element Selectors
    const card = document.getElementById('card');
    const frontEs = document.getElementById('front-es');
    const frontPos = document.getElementById('front-pos');
    const backTh = document.getElementById('back-th');
    const backExEs = document.getElementById('back-ex-es');
    const backExTh = document.getElementById('back-ex-th');
    const roundDisplay = document.getElementById('round-display');
    const cardCounter = document.getElementById('card-counter');

    // UI Drawer Functions
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function initRoundMenu() {
      const list = document.getElementById('round-list');
      for (let i = 1; i <= 150; i++) {
        const item = document.createElement('div');
        item.className = 'round-item';
        item.innerText = `รอบที่ ${i}`;
        item.onclick = () => selectRound(i);
        list.appendChild(item);
      }
    }

    // Logic Functions
    function selectRound(roundNum) {
      currentRound = roundNum;
      roundDisplay.innerText = `รอบที่ ${currentRound}`;
      toggleMenu();
      loadRoundData();
    }

    function loadRoundData() {
      const data = allData[currentRound] || [];
      currentQueue = [...data];
      currentIndex = 0;
      card.classList.remove('flipped');
      
      if (currentQueue.length > 0) {
        showCard();
      } else {
        showEmptyState();
      }
    }

    function showCard() {
      if (currentQueue.length === 0) return;
      const item = currentQueue[currentIndex];
      frontEs.innerText = item.es;
      frontPos.innerText = `(${item.pos})`;
      backTh.innerText = item.th;
      backExEs.innerText = item.exEs;
      backExTh.innerText = item.exTh;
      cardCounter.innerText = `เหลือคำศัพท์ในรอบนี้: ${currentQueue.length} คำ`;
    }

    function showEmptyState() {
      frontEs.innerText = "🎉";
      frontPos.innerText = "ยังไม่มีคำศัพท์ในรอบนี้";
      backTh.innerText = "เรียนรู้ครบแล้ว!";
      backExEs.innerText = "";
      backExTh.innerText = "";
      cardCounter.innerText = "เหลือคำศัพท์ในรอบนี้: 0 คำ";
    }

    function flipCard(event) {
      if (event.target.tagName !== 'BUTTON') {
        card.classList.toggle('flipped');
      }
    }

    function handleRemember() {
      if (currentQueue.length === 0) return;
      card.classList.remove('flipped');
      setTimeout(() => {
        currentQueue.splice(currentIndex, 1);
        if (currentQueue.length === 0) {
          showEmptyState();
        } else {
          if (currentIndex >= currentQueue.length) currentIndex = 0;
          showCard();
        }
      }, 200);
    }

    function handleSkip() {
      if (currentQueue.length <= 1) return;
      card.classList.remove('flipped');
      setTimeout(() => {
        // ย้ายคำปัจจุบันไปต่อท้ายคลังคำศัพท์
        const skippedItem = currentQueue.splice(currentIndex, 1)[0];
        currentQueue.push(skippedItem);
        showCard();
      }, 200);
    }

    // Text to Speech Function (Spanish Accent)
    function speakCurrent(event, type) {
      event.stopPropagation();
      if (currentQueue.length === 0) return;
      
      const item = currentQueue[currentIndex];
      const text = (type === 'word') ? item.es : item.exEs;
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES'; // สำเนียงสเปน
      utterance.rate = 0.9;     // ความเร็วพอเหมาะสำหรับการฝึก
      window.speechSynthesis.speak(utterance);
    }

    // Initialize App
    initRoundMenu();
    loadRoundData();
  </script>
</body>
</html>
