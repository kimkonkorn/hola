<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝึกภาษาสเปน Flashcards</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Global Styles - โทนสีขาว ครีม มินิมอล */
    :root {
      --bg-color: #faf8f5;
      --card-bg: #ffffff;
      --primary-color: #8c7a6b;
      --text-dark: #4a4238;
      --text-muted: #8c827a;
      --accent-soft: #f3efe6;
      --border-color: #e8e2d5;
      --shadow: 0 10px 30px rgba(140, 122, 107, 0.08);
      --success-color: #7a9a60;
      --retry-color: #d97767;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Kanit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Header & Navigation Bar */
    header {
      width: 100%;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: transparent;
      max-width: 800px;
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 5px;
    }

    .menu-btn span {
      display: block;
      width: 25px;
      height: 3px;
      background-color: var(--primary-color);
      border-radius: 3px;
    }

    .round-info {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-color);
      background-color: var(--accent-soft);
      padding: 6px 16px;
      border-radius: 20px;
    }

    /* Sidebar Selection Menu */
    .sidebar {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background-color: var(--card-bg);
      box-shadow: 5px 0 25px rgba(0,0,0,0.05);
      transition: left 0.3s ease;
      z-index: 100;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .round-list {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding-right: 5px;
    }

    .round-item {
      padding: 10px;
      text-align: center;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .round-item:hover, .round-item.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(74, 66, 56, 0.2);
      display: none;
      z-index: 90;
    }

    .overlay.show {
      display: block;
    }

    /* Main Container & Flashcard */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      height: 380px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Card Front */
    .card-front {
      gap: 15px;
    }

    .word-spanish {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .part-of-speech {
      font-size: 1rem;
      color: var(--text-muted);
      font-style: italic;
      background-color: var(--accent-soft);
      padding: 4px 14px;
      border-radius: 12px;
    }

    /* Card Back (จัดกึ่งกลาง) */
    .card-back {
      transform: rotateY(180deg);
      gap: 18px;
    }

    .word-translation {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .example-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .example-sentence {
      font-size: 1.1rem;
      color: var(--text-dark);
      font-weight: 500;
      line-height: 1.4;
    }

    .example-translation {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Audio Button */
    .audio-btn {
      background-color: var(--accent-soft);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 5px;
    }

    .audio-btn:hover {
      background-color: var(--border-color);
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .audio-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--primary-color);
    }

    .flip-hint {
      position: absolute;
      bottom: 15px;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Controls (จำได้ / กดผ่าน) */
    .controls {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .btn-retry {
      background-color: #fdf2f0;
      color: var(--retry-color);
      border: 1px solid #f7d7d2;
    }

    .btn-retry:hover {
      background-color: #fce8e5;
    }

    .btn-remember {
      background-color: #f2f7ef;
      color: var(--success-color);
      border: 1px solid #d8e6d2;
    }

    .btn-remember:hover {
      background-color: #e6f0e2;
    }

    .progress-text {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Overlay เมื่อเปิด Sidebar -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar เลือกรอบ (1 - 150) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>เลือกรอบฝึกซ้อม</h3>
      <button class="close-btn" onclick="closeSidebar()">&times;</button>
    </div>
    <div class="round-list" id="roundList">
      <!-- วนลูปสร้างรอบที่ 1 ถึง 150 ด้วย JS -->
    </div>
  </div>

  <!-- Header -->
  <header>
    <button class="menu-btn" onclick="openSidebar()" title="เลือกรอบ">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="round-info" id="roundTitle">รอบที่ 1</div>
  </header>

  <!-- Main Flashcard Area -->
  <main>
    <div class="card-container" onclick="flipCard()">
      <div class="card" id="card">
        
        <!-- หน้าที่ 1: คำศัพท์ภาษาสเปน + ชนิดของคำ + ปุ่มออกเสียง -->
        <div class="card-face card-front">
          <div class="word-spanish" id="frontWord">Hola</div>
          <div class="part-of-speech" id="frontPos">interjección</div>
          <button class="audio-btn" onclick="speakWord(event)" title="ฟังเสียงคำศัพท์">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <div class="flip-hint">แตะที่การ์ดเพื่อพลิกดูคำแปล</div>
        </div>

        <!-- หน้าที่ 2: คำแปล + ตัวอย่างประโยค + แปลไทย (รวมกันอยู่กึ่งกลาง) -->
        <div class="card-face card-back">
          <div class="word-translation" id="backTranslation">สวัสดี</div>
          <div class="example-section">
            <div class="example-sentence" id="backExample">¡Hola! ¿Cómo estás?</div>
            <div class="example-translation" id="backExampleTh">สวัสดี! คุณสบายดีไหม?</div>
            <button class="audio-btn" onclick="speakExample(event)" title="ฟังเสียงประโยคตัวอย่าง">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
          </div>
          <div class="flip-hint">แตะที่การ์ดเพื่อกลับไปหน้าแรก</div>
        </div>

      </div>
    </div>

    <!-- ปุ่มควบคุม -->
    <div class="controls">
      <button class="btn btn-retry" onclick="handlePass()">กดผ่าน (ทบทวนใหม่)</button>
      <button class="btn btn-remember" onclick="handleRemember()">จำได้</button>
    </div>

    <div class="progress-text" id="progressText">เหลือ 20 คำในรอบนี้</div>
  </main>

  <script>
    /* =======================================================
       1. คลังข้อมูลคำศัพท์ (ส่วนนี้สามารถใส่เรียงต่อกันได้ง่ายๆ)
       แบ่งเป็นรอบ รอบละ 20 คำ (ตัวอย่างสร้างรอบที่ 1 และเตรียมโครงสร้างไว้)
       ======================================================= */
    const vocabularyData = {
      1: [
        { word: "Hola", pos: "interjección", translation: "สวัสดี", example: "¡Hola! ¿Cómo estás?", exampleTh: "สวัสดี! คุณสบายดีไหม?" },
        { word: "Gracias", pos: "sustantivo", translation: "ขอบคุณ", example: "Muchas gracias por tu ayuda.", exampleTh: "ขอบคุณมากสำหรับความช่วยเหลือของคุณ" },
        { word: "Amigo", pos: "sustantivo", translation: "เพื่อน (ชาย)", example: "Él es mi mejor amigo.", exampleTh: "เขาคือเพื่อนที่ดีที่สุดของฉัน" },
        { word: "Casa", pos: "sustantivo", translation: "บ้าน", example: "Mi casa es grande.", exampleTh: "บ้านของฉันหลังใหญ่" },
        { word: "Comer", pos: "verbo", translation: "กิน / รับประทาน", example: "Quiero comer paella.", exampleTh: "ฉันอยากกินข้าวผัดสเปน" },
        { word: "Agua", pos: "sustantivo", translation: "น้ำ", example: "Un vaso de agua, por favor.", exampleTh: "ขอหน้าน้ำเปล่าหนึ่งแก้วครับ/ค่ะ" },
        { word: "Sol", pos: "sustantivo", translation: "พระอาทิตย์", example: "El sol brilla hoy.", exampleTh: "วันนี้พระอาทิตย์ส่องแสงสว่าง" },
        { word: "Libro", pos: "sustantivo", translation: "หนังสือ", example: "Estoy leyendo un libro.", exampleTh: "ฉันกำลังอ่านหนังสือ" },
        { word: "Feliz", pos: "adjetivo", translation: "มีความสุข", example: "Hoy me siento feliz.", exampleTh: "วันนี้ฉันรู้สึกมีความสุข" },
        { word: "Tiempo", pos: "sustantivo", translation: "เวลา / อากาศ", example: "No tengo mucho tiempo.", exampleTh: "ฉันมีเวลาไม่มาก" },
        { word: "Gato", pos: "sustantivo", translation: "แมว", example: "El gato duerme en la cama.", exampleTh: "แมวนอนอยู่บนเตียง" },
        { word: "Perro", pos: "sustantivo", translation: "สุนัข", example: "Mi perro es muy juguetón.", exampleTh: "สุนัขของฉันขี้เล่นมาก" },
        { word: "Bonito", pos: "adjetivo", translation: "สวย / น่ารัก", example: "Es un lugar bonito.", exampleTh: "มันเป็นสถานที่สวยงาม" },
        { word: "Hablar", pos: "verbo", translation: "พูด", example: "Hablo un poco de español.", exampleTh: "ฉันพูดภาษาสเปนได้นิดหน่อย" },
        { word: "Aprender", pos: "verbo", translation: "เรียนรู้", example: "Me gusta aprender idiomas.", exampleTh: "ฉันชอบเรียนภาษา" },
        { word: "Familia", pos: "sustantivo", translation: "ครอบครัว", example: "Amo a mi familia.", exampleTh: "ฉันรักครอบครัวของฉัน" },
        { word: "Música", pos: "sustantivo", translation: "ดนตรี / เพลง", example: "Escucho música todos los días.", exampleTh: "ฉันฟังเพลงทุกวัน" },
        { word: "Trabajo", pos: "sustantivo", translation: "งาน / การทำงาน", example: "Tengo mucho trabajo.", exampleTh: "ฉันมีงานทำเยอะมาก" },
        { word: "Ciudad", pos: "sustantivo", translation: "เมือง", example: "Madrid es una gran ciudad.", exampleTh: "มาดริดเป็นเมืองที่ใหญ่" },
        { word: "Siempre", pos: "adverbio", translation: "เสมอ / ตลอดเวลา", example: "Siempre te recordaré.", exampleTh: "ฉันจะจดจำคุณเสมอ" }
      ]
      // สามารถใส่คำศัพท์รอบที่ 2 ถึง 150 เพิ่มเติมต่อตรงนี้ได้เลย:
      // 2: [ { word: "...", ... }, ... ],
    };

    /* =======================================================
       2. ระบบจัดการสถานะเว็บไซต์ (State Management)
       ======================================================= */
    let currentRound = 1;
    let currentQueue = []; // คิวคำศัพท์ที่ต้องฝึกในรอบปัจจุบัน
    let currentIndex = 0;
    let isFlipped = false;

    // ระบบอ่านออกเสียง (Text-to-Speech)
    const synth = window.speechSynthesis;

    function speakText(text) {
      if (synth.speaking) synth.cancel(); // ถ้าระบบกำลังพูดอยู่ให้หยุดก่อน
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES'; // ตั้งค่าภาษาเป็นสเปน (เจ้าของภาษา)
      utterance.rate = 0.9;     // ความเร็วระดับพอดีสำหรับการฝึกภาษา
      synth.speak(utterance);
    }

    function speakWord(event) {
      event.stopPropagation(); // ไม่ให้เกิด event พลิกการ์ดเมื่อกดปุ่มเสียง
      if (currentQueue.length > 0) {
        speakText(currentQueue[currentIndex].word);
      }
    }

    function speakExample(event) {
      event.stopPropagation(); // ไม่ให้เกิด event พลิกการ์ดเมื่อกดปุ่มเสียง
      if (currentQueue.length > 0) {
        speakText(currentQueue[currentIndex].example);
      }
    }

    /* =======================================================
       3. ฟังก์ชันการทำงานของ Flashcard และ Sidebar
       ======================================================= */
    function initSidebar() {
      const roundList = document.getElementById('roundList');
      roundList.innerHTML = '';
      
      // สร้างปุ่มเลือกรอบที่ 1 ถึง 150
      for (let i = 1; i <= 150; i++) {
        const item = document.createElement('div');
        item.className = `round-item ${i === currentRound ? 'active' : ''}`;
        item.innerText = `รอบที่ ${i}`;
        item.onclick = () => selectRound(i);
        roundList.appendChild(item);
      }
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('show');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    function selectRound(roundNum) {
      currentRound = roundNum;
      document.getElementById('roundTitle').innerText = `รอบที่ ${roundNum}`;
      closeSidebar();
      initRound();
      initSidebar(); // อัปเดตการแสดงผลรอบที่เลือกใน sidebar
    }

    function initRound() {
      // ดึงข้อมูลคำศัพท์ของรอบที่เลือก หากไม่มีให้สร้างคำศัพท์จำลอง 20 คำ
      if (vocabularyData[currentRound]) {
        currentQueue = [...vocabularyData[currentRound]];
      } else {
        // กรณีรอบนั้นยังไม่มีข้อมูลในระบบ จะสร้างข้อมูลตัวอย่างไว้
        currentQueue = Array.from({ length: 20 }, (_, i) => ({
          word: `Palabra ${i + 1}`,
          pos: "sustantivo",
          translation: `คำแปลที่ ${i + 1} (รอบ ${currentRound})`,
          example: `Ejemplo de oración número ${i + 1}.`,
          exampleTh: `ประโยคตัวอย่างที่ ${i + 1}`
        }));
      }

      currentIndex = 0;
      resetCardFlip();
      renderCard();
    }

    function renderCard() {
      if (currentQueue.length === 0) {
        // เมื่อเรียนครบจำได้หมดทุกคำในรอบนี้
        document.getElementById('frontWord').innerText = "¡Felicidades!";
        document.getElementById('frontPos').innerText = "ยินดีด้วยคุณจำได้ครบแล้ว";
        document.getElementById('backTranslation').innerText = "เยี่ยมมาก!";
        document.getElementById('backExample').innerText = "คุณจำคำศัพท์ทั้งหมดในรอบนี้ได้แล้ว";
        document.getElementById('backExampleTh').innerText = "";
        document.getElementById('progressText').innerText = "เก่งมาก! เลือกรอบต่อไปที่เมนูได้เลย";
        return;
      }

      const item = currentQueue[currentIndex];
      // แสดงผลด้านหน้า
      document.getElementById('frontWord').innerText = item.word;
      document.getElementById('frontPos').innerText = item.pos;
      
      // แสดงผลด้านหลัง (จัดวางรวมกันตรงกลาง)
      document.getElementById('backTranslation').innerText = item.translation;
      document.getElementById('backExample').innerText = item.example;
      document.getElementById('backExampleTh').innerText = item.exampleTh;

      // อัปเดตจำนวนคงเหลือ
      document.getElementById('progressText').innerText = `เหลือคำที่ต้องจำอีก ${currentQueue.length} คำในรอบนี้`;
    }

    function flipCard() {
      const card = document.getElementById('card');
      isFlipped = !isFlipped;
      if (isFlipped) {
        card.classList.add('flipped');
      } else {
        card.classList.remove('flipped');
      }
    }

    function resetCardFlip() {
      isFlipped = false;
      document.getElementById('card').classList.remove('flipped');
    }

    /* =======================================================
       4. ปุ่ม "จำได้" และ "กดผ่าน (ทบทวนใหม่)"
       ======================================================= */
    function handleRemember() {
      if (currentQueue.length === 0) return;

      // ตัดคำศัพท์ที่จำได้ออกจากคิว
      currentQueue.splice(currentIndex, 1);
      
      // ถ้าดัชนีเกินความยาวคิวให้กลับไปเริ่มที่ 0
      if (currentIndex >= currentQueue.length) {
        currentIndex = 0;
      }

      resetCardFlip();
      setTimeout(() => {
        renderCard();
      }, 200); // รอให้การ์ดเริ่มหมุนกลับแล้วค่อยเปลี่ยนข้อมูล
    }

    function handlePass() {
      if (currentQueue.length <= 1) return; // ถ้าเหลือ 1 คำกดผ่านก็จะวนเจอคำเดิม

      // ย้ายคำศัพท์ปัจจุบันไปไว้ต่อท้ายคิวเพื่อนำกลับมาฝึกใหม่
      const currentItem = currentQueue.splice(currentIndex, 1)[0];
      currentQueue.push(currentItem);

      resetCardFlip();
      setTimeout(() => {
        renderCard();
      }, 200);
    }

    // เริ่มต้นระบบเมื่อโหลดหน้าเว็บ
    window.onload = () => {
      initSidebar();
      initRound();
    };
  </script>
</body>
</html>
