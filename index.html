<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Flashcard App</title>
    <style>
        :root {
            --bg-color: #fcfbf7;
            --card-bg: #ffffff;
            --text-main: #33322e;
            --text-sub: #787670;
            --accent-soft: #f4efe6;
            --border-color: #e8e3d9;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            --green: #81b29a;
            --red: #e07a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }

        .menu-btn div {
            width: 25px;
            height: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: 0.3s;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .round-indicator {
            font-size: 0.9rem;
            color: var(--text-sub);
            background-color: var(--accent-soft);
            padding: 5px 12px;
            border-radius: 15px;
        }

        /* Sidebar Menu */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            z-index: 100;
            transition: 0.3s ease-in-out;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-sub);
        }

        .round-list {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .round-item {
            padding: 12px 15px;
            border-radius: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .round-item:hover, .round-item.active {
            background-color: var(--accent-soft);
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.2);
            z-index: 99;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Progress Bar */
        .progress-container {
            width: 90%;
            max-width: 400px;
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--accent-soft);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--green);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: right;
        }

        /* Flashcard Container */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            height: 420px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* Front Face */
        .card-front {
            z-index: 2;
        }

        .word-main {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: auto;
            margin-bottom: 10px;
        }

        .word-type {
            font-size: 1rem;
            color: var(--text-sub);
            font-style: italic;
            background-color: var(--accent-soft);
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: auto;
        }

        /* Back Face */
        .card-back {
            transform: rotateY(180deg);
            align-items: flex-start;
            text-align: left;
        }

        .translation-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .translation-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .example-section {
            width: 100%;
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: auto;
        }

        .example-es {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .example-th {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        /* Audio Button */
        .audio-btn {
            background-color: var(--accent-soft);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-main);
        }

        .audio-btn:hover {
            background-color: #e8dfd1;
        }

        .audio-btn-small {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 380px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .btn-pass {
            background-color: #fdf2f0;
            color: var(--red);
            border: 1px solid #f7d6d0;
        }

        .btn-pass:hover {
            background-color: #fbe5e1;
        }

        .btn-remember {
            background-color: #f0f7f4;
            color: var(--green);
            border: 1px solid #d3e5dd;
        }

        .btn-remember:hover {
            background-color: #e1f0e9;
        }

        .flip-hint {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Overlay & Sidebar -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>เลือกรอบการเรียน</h3>
            <button class="close-btn" onclick="toggleMenu()">&times;</button>
        </div>
        <div class="round-list" id="roundList">
            <!-- Rounds 1-20 generated by JS -->
        </div>
    </div>

    <!-- Header -->
    <header>
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
            <div></div>
            <div></div>
            <div></div>
        </button>
        <div class="title">SPANISH FLASHCARDS</div>
        <div class="round-indicator" id="roundDisplay">รอบที่ 1</div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">เหลือ 0 คำในคลัง</div>
        </div>

        <!-- Flashcard -->
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                
                <!-- Front Side -->
                <div class="card-face card-front">
                    <div></div> <!-- Empty spacer -->
                    <div>
                        <div class="word-main" id="wordEs">Hola</div>
                        <div class="word-type" id="wordType">Sustantivo (คำนาม)</div>
                    </div>
                    <button class="audio-btn" onclick="speakCurrentWord(event)" title="ฟังเสียงอ่าน">
                        🔊
                    </button>
                </div>

                <!-- Back Side -->
                <div class="card-face card-back">
                    <div>
                        <div class="translation-title">คำแปลไทย</div>
                        <div class="translation-text" id="wordTh">สวัสดี</div>
                    </div>

                    <div class="example-section">
                        <div class="translation-title">ตัวอย่างประโยค</div>
                        <div class="example-es">
                            <span id="exampleEs">¡Hola! ¿Cómo estás?</span>
                            <button class="audio-btn audio-btn-small" onclick="speakExample(event)" title="ฟังเสียงประโยค">
                                🔊
                            </button>
                        </div>
                        <div class="example-th" id="exampleTh">สวัสดี! คุณสบายดีไหม?</div>
                    </div>

                    <button class="audio-btn" onclick="speakCurrentWord(event)" title="ฟังเสียงอ่านคำศัพท์">
                        🔊
                    </button>
                </div>

            </div>
        </div>

        <div class="flip-hint">แตะที่การ์ดเพื่อพลิกดูคำแปล</div>

        <!-- Action Buttons -->
        <div class="controls">
            <button class="btn btn-pass" onclick="handlePass()">ผ่าน (ทวนใหม่)</button>
            <button class="btn btn-remember" onclick="handleRemember()">จำได้แล้ว</button>
        </div>

    </div>

    <script>
        // ตัวอย่างข้อมูลคำศัพท์ (ในระบบจริงสามารถขยายเป็น 50 คำต่อรอบ x 20 รอบ = 1000 คำได้)
        const mockDatabase = {
            1: [
                { es: "Hola", type: "Interyección (คำอุทาน)", th: "สวัสดี", exEs: "¡Hola! ¿Cómo estás?", exTh: "สวัสดี! คุณสบายดีไหม?" },
                { es: "Gracias", type: "Interyección (คำอุทาน)", th: "ขอบคุณ", exEs: "Muchas gracias por tu ayuda.", exTh: "ขอบคุณมากสำหรับความช่วยเหลือของคุณ" },
                { es: "Casa", type: "Sustantivo (คำนาม)", th: "บ้าน", exEs: "Mi casa es muy grande y bonita.", exTh: "บ้านของฉันใหญ่และสวยมาก" },
                { es: "Comer", type: "Verbo (คำกริยา)", th: "กิน / ทาน", exEs: "Me gusta comer pizza los fines de semana.", exTh: "ฉันชอบกินพิซซ่าในวันเสาร์-อาทิตย์" },
                { es: "Feliz", type: "Adjetivo (คำคุณศัพท์)", th: "มีความสุข", exEs: "Hoy me siento muy feliz.", exTh: "วันนี้ฉันรู้สึกมีความสุขมาก" }
            ],
            2: [
                { es: "Agua", type: "Sustantivo (คำนาม)", th: "น้ำ", exEs: "Bebo dos litros de agua al día.", exTh: "ฉันดื่มน้ำวันละสองลิตร" },
                { es: "Amigo", type: "Sustantivo (คำนาม)", th: "เพื่อน", exEs: "Juan es mi mejor amigo.", exTh: "ฆวนเป็นเพื่อนที่ดีที่สุดของฉัน" },
                { es: "Dormir", type: "Verbo (คำกริยา)", th: "นอนหลับ", exEs: "Necesito dormir ocho horas.", exTh: "ฉันจำเป็นต้องนอนแปดชั่วโมง" }
            ]
        };

        // สำหรับรอบที่ 3-20 หากไม่มีข้อมูล จะสร้างคำศัพท์จำลองให้อัตโนมัติ
        for (let r = 3; r <= 20; r++) {
            mockDatabase[r] = [
                { es: `Palabra ${r}-1`, type: "Sustantivo", th: `คำศัพท์รอบที่ ${r} (1)`, exEs: `Ejemplo de oración ${r}-1.`, exTh: `ตัวอย่างประโยค ${r}-1` },
                { es: `Palabra ${r}-2`, type: "Verbo", th: `คำศัพท์รอบที่ ${r} (2)`, exEs: `Ejemplo de oración ${r}-2.`, exTh: `ตัวอย่างประโยค ${r}-2` }
            ];
        }

        // State Variables
        let currentRound = 1;
        let activeQueue = []; // คิวคำศัพท์ในรอบปัจจุบัน (จะวนซ้ำคำที่กด "ผ่าน")
        let totalInRound = 0;
        let currentIndex = 0;

        // Elements
        const flashcard = document.getElementById('flashcard');
        const wordEs = document.getElementById('wordEs');
        const wordType = document.getElementById('wordType');
        const wordTh = document.getElementById('wordTh');
        const exampleEs = document.getElementById('exampleEs');
        const exampleTh = document.getElementById('exampleTh');
        const progressFill = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const roundDisplay = document.getElementById('roundDisplay');

        // Initialize Sidebar Menu
        function initSidebar() {
            const roundList = document.getElementById('roundList');
            roundList.innerHTML = '';
            for (let i = 1; i <= 20; i++) {
                const item = document.createElement('div');
                item.className = `round-item ${i === currentRound ? 'active' : ''}`;
                item.innerHTML = `<span>รอบที่ ${i}</span> <small style="color:var(--text-sub)">50 คำ</small>`;
                item.onclick = () => selectRound(i);
                roundList.appendChild(item);
            }
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function selectRound(roundNum) {
            currentRound = roundNum;
            roundDisplay.innerText = `รอบที่ ${currentRound}`;
            initSidebar();
            toggleMenu();
            loadRound(currentRound);
        }

        // Load Round Data
        function loadRound(roundNum) {
            // โคลนคอลเลกชันคำศัพท์มาใช้ใน Queue
            const data = mockDatabase[roundNum] || [];
            activeQueue = [...data];
            totalInRound = activeQueue.length;
            currentIndex = 0;
            
            if (flashcard.classList.contains('flipped')) {
                flashcard.classList.remove('flipped');
            }

            renderCard();
        }

        // Render Current Card
        function renderCard() {
            if (activeQueue.length === 0) {
                // จบการเรียนรอบนี้
                wordEs.innerText = "¡Felicidades!";
                wordType.innerText = "ยินดีด้วย คุณจำได้ครบทุกคำแล้ว";
                wordTh.innerText = "สำนักสำเร็จ!";
                exampleEs.innerText = "Has completado esta ronda.";
                exampleTh.innerText = "คุณเรียนจบช่วงนี้เรียบร้อยแล้ว";
                updateProgress();
                return;
            }

            const current = activeQueue[0];
            wordEs.innerText = current.es;
            wordType.innerText = current.type;
            wordTh.innerText = current.th;
            exampleEs.innerText = current.exEs;
            exampleTh.innerText = current.exTh;

            updateProgress();
        }

        function updateProgress() {
            const remaining = activeQueue.length;
            progressText.innerText = `เหลือ ${remaining} คำในคลัง`;
            
            // คำนวณความคืบหน้า (อิงจากคำที่เหลือเทียบกับจำนวนเริ่มต้น)
            const learned = totalInRound - remaining;
            const percentage = totalInRound > 0 ? (learned / totalInRound) * 100 : 100;
            progressFill.style.width = `${percentage}%`;
        }

        // Card Interaction
        function flipCard() {
            flashcard.classList.toggle('flipped');
        }

        // Handlers for Remember / Pass
        function handleRemember() {
            if (activeQueue.length === 0) return;

            // รีเซ็ตหน้าการ์ดกลับไปด้านหน้าก่อนเปลี่ยนคำ
            if (flashcard.classList.contains('flipped')) {
                flashcard.classList.remove('flipped');
                setTimeout(() => {
                    activeQueue.shift(); // ลบคำนี้ออกจากคิว (จำได้แล้ว)
                    renderCard();
                }, 200);
            } else {
                activeQueue.shift();
                renderCard();
            }
        }

        function handlePass() {
            if (activeQueue.length === 0) return;

            // ย้ายคำปัจจุบันไปไว้ท้ายคิวเพื่อวนมาถามใหม่
            if (flashcard.classList.contains('flipped')) {
                flashcard.classList.remove('flipped');
                setTimeout(() => {
                    const passWord = activeQueue.shift();
                    activeQueue.push(passWord);
                    renderCard();
                }, 200);
            } else {
                const passWord = activeQueue.shift();
                activeQueue.push(passWord);
                renderCard();
            }
        }

        // Text-To-Speech (อ่านออกเสียงภาษาสเปน)
        function speakCurrentWord(e) {
            e.stopPropagation(); // ไม่ให้เกิดการพลิกการ์ดเมื่อกดปุ่มเสียง
            if (activeQueue.length === 0) return;
            
            const text = activeQueue[0].es;
            speakSpanish(text);
        }

        function speakExample(e) {
            e.stopPropagation();
            if (activeQueue.length === 0) return;

            const text = activeQueue[0].exEs;
            speakSpanish(text);
        }

        function speakSpanish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // ยกเลิกเสียงที่กำลังพูดอยู่ก่อนหน้า
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES'; // ตั้งเป็นภาษาสเปน
                utterance.rate = 0.9; // ความเร็วในการพูด
                window.speechSynthesis.speak(utterance);
            } else {
                alert('เบราว์เซอร์ของคุณไม่รองรับการอ่านออกเสียง');
            }
        }

        // Start App
        initSidebar();
        loadRound(1);
    </script>
</body>
</html>
